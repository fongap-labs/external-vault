name: Dispatch OCR Release Governance

on:
  workflow_run:
    workflows: [Sync OpenCodeReview]
    types: [completed]
    branches: [main]

permissions:
  actions: read

concurrency:
  group: dispatch-ocr-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch verified OCR release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Inspect source artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          count="$(
            gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "open-code-review-release" and .expired == false)] | length'
          )"

          case "$count" in
            0)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "No new stable release artifact was produced; dispatch is not required." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected at most one open-code-review-release artifact, found $count." >&2
              exit 1
              ;;
          esac

      - name: Validate dispatch credential
        if: ${{ steps.artifact.outputs.publish == 'true' }}
        env:
          ACTION_WORKER_TOKEN: ${{ secrets.ACTION_WORKER_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "$ACTION_WORKER_TOKEN" ] || {
            echo "::error::ACTION_WORKER_TOKEN is not configured." >&2
            exit 1
          }

      - name: Dispatch central release governance
        if: ${{ steps.artifact.outputs.publish == 'true' }}
        env:
          ACTION_WORKER_TOKEN: ${{ secrets.ACTION_WORKER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_ID: release-${{ github.repository_id }}-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          payload="$(
            jq -cn \
              --arg request_id "$REQUEST_ID" \
              --arg repository "$REPOSITORY" \
              --arg source_sha "$SOURCE_SHA" \
              --argjson source_run_id "$SOURCE_RUN_ID" \
              '{
                event_type: "run-release",
                client_payload: {
                  schema_version: "1",
                  request_id: $request_id,
                  repository: $repository,
                  source_sha: $source_sha,
                  source_run_id: $source_run_id,
                  artifact_name: "open-code-review-release"
                }
              }'
          )"

          curl -fsS \
            --retry 2 \
            --retry-delay 1 \
            --request POST \
            --header "Authorization: Bearer $ACTION_WORKER_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY_OWNER/action-worker/dispatches" \
            --data "$payload"
