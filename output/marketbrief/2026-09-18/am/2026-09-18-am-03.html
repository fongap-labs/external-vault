<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1440px;background:#FBF9F3;color:#25282A;font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}
body:before{content:none}
main{position:relative;margin:0;width:1080px;height:1440px;padding:72px 80px 96px 136px;background:#FBF9F3;border:0;border-radius:0;box-shadow:none;overflow:hidden}
main:before{content:'';position:absolute;z-index:2;left:28px;top:48px;bottom:48px;width:18px;background:radial-gradient(circle at center,#EEECE6 0 5px,#CDD1D2 5.5px 6.5px,transparent 7px) center top/18px 60px repeat-y;pointer-events:none}
main:after{content:none}
.top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px}
.brand{display:inline-block;padding:10px 18px;background:#E8D98C;transform:rotate(-.35deg);font-size:24px;font-weight:800;letter-spacing:1px}
.tagline{font-size:23px;font-weight:700;color:#667078;padding-top:8px}
.kicker{position:relative;z-index:1;font-size:25px;font-weight:800;letter-spacing:3px;color:#667078;margin-bottom:18px}
h1{position:relative;z-index:1;font-size:72px;line-height:1.12;margin:0 0 20px;font-weight:900;letter-spacing:-2px}
h1 span{background:linear-gradient(transparent 62%,#B8CDE0 62% 88%,transparent 88%);padding:0 .08em}
.sub{position:relative;z-index:1;font-size:31px;line-height:1.5;color:#667078;margin-bottom:38px;max-width:820px}
.notes{position:relative;z-index:1;display:grid;gap:18px;max-width:864px}
.note{position:relative;min-height:132px;padding:26px 30px 24px 92px;background:rgba(255,255,255,.56);border:1px solid #CDD1D2;box-shadow:4px 5px 0 rgba(0,0,0,.035);transform:rotate(0deg)}
.note:nth-child(2){transform:rotate(.08deg)}.note:nth-child(3){transform:rotate(-.06deg)}
.note b{position:absolute;left:28px;top:24px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#E8D98C;font-size:24px}
.note p{margin:0;font-size:31px;line-height:1.55;font-weight:650}
.margin{position:relative;z-index:1;margin-top:34px;display:flex;gap:18px;align-items:center;color:#667078;font-size:22px}
.sketch{width:64px;height:30px;border-bottom:4px solid #B8CDE0;border-radius:50%;transform:rotate(-7deg)}
footer{position:absolute;z-index:1;left:136px;right:80px;bottom:54px;border-top:1px dashed #CDD1D2;padding-top:20px;display:flex;justify-content:space-between;gap:20px;color:#667078;font-size:20px}

</style></head>
<body><main data-layout-type="card" data-visual-style="notebook" data-visual-tone="serious">
<div class="top"><span class="brand">MarketBrief</span><span class="tagline">市场手账 · 抓重点，也看分歧</span></div>
<div class="kicker">市场概览</div>
<h1><span>A股结构与资金</span></h1>
<div class="sub">只呈现有当前证据支持的指数、成交、涨跌结构和资金特征。</div>
<div class="notes"><section class="note"><b>1</b><p>A股市场点评：科创领涨</p></section><section class="note"><b>2</b><p>A股市场点评：电子领涨</p></section><section class="note"><b>3</b><p>继续观察公开信息变化，避免仅凭单一信号下结论。</p></section></div>
<div class="margin"><span class="sketch"></span><span>基于公开信息整理 · 保持独立判断，关注事实变化</span></div>
<footer><span>仅供信息参考，不构成投资建议</span><span>2026.09.18 · 早刊</span></footer>
</main></body></html>
